<style>

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

const modal=()=>{const p=S.prods.find(x=>x.id==sel);if(!p)return'';return`<div class="ov" onclick="if(event.target==this){sel=null;render()}"><div class="md"><button class="x" onclick="sel=null;render()">✕</button><div class="im">${img(p)}</div><h2>${e(p.n)}</h2><div class="pr">${R(p.pr)}</div>${pi(p.pr)}<p class="mu">${e(p.d)}</p><b>Tamanho</b><div class="szb">${S.sizes.map(z=>{const q=+p.s[z]||0;return`<button class="${z==sz?'on':''}" ${q?'':'disabled'} data-z="${e(z)}" onclick="sz=this.dataset.z;render()">${e(z)}${q&&q<=2?'<small>últimas</small>':''}</button>`}).join('')}</div><button class="p wide" onclick="add('${p.id}')">Adicionar à sacola</button></div></div>`};
function add(id){if(!sz)return msg('Escolha um tamanho');const p=S.prods.find(x=>x.id==id),c=cart.find(x=>x.id==id&&x.z==sz);if((c?c.q:0)>=(+p.s[sz]||0))return msg('Sem mais estoque desse tamanho');c?c.q++:cart.push({id,z:sz,q:1});sel=null;msg('Adicionado à sacola 💗')}
